appId: io.mergit.app
productName: Mergit
directories:
  output: release
files:
  - out/**
  - resources/**
  # 디자인 원본은 패키지에 포함하지 않는다
  - '!resources/mergit-app-icon-flat.png'
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  deleteAppDataOnUninstall: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
